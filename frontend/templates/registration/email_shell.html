{% load i18n %}
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f7f1;font-family:Arial,sans-serif;color:#163020;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7f1;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(135deg,#2f855a,#3fbf7f);padding:28px 32px;color:#ffffff;">
              <div style="font-size:13px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.9;">{{ app_name }}</div>
              <h1 style="margin:10px 0 0;font-size:28px;line-height:1.2;">{{ title }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;">
              <p style="margin:0 0 18px;font-size:16px;line-height:1.6;">{{ intro }}</p>
              <div style="margin:0 0 20px;padding:18px;border-radius:16px;background:#edf9f0;text-align:center;font-size:32px;font-weight:700;letter-spacing:0.22em;color:#166534;">
                {{ accent }}
              </div>
              {% for line in body_lines %}
                <p style="margin:0 0 12px;font-size:15px;line-height:1.7;">{{ line }}</p>
              {% endfor %}
              <p style="margin:20px 0 0;font-size:14px;line-height:1.6;color:#4b5563;">{{ footer }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
