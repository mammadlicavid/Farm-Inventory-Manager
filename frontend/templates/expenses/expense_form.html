{% extends 'base.html' %}
{% load i18n %}
{% load common_extras %}
{% block content %}
<header class="main-header">
    <div class="header-content">
        <div class="header-top">
            <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?form=expense{% endif %}" class="back-btn-box">
                <i class="fa-solid fa-arrow-left"></i>
                <span>{% trans "Xərci Düzəlt" %}</span>
            </a>
        </div>
    </div>
</header>

<main class="main-content" style="margin-top: -20px; position: relative; z-index: 10;">
    <div class="form-container-white">
        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">{% trans "Xərc Məlumatlarını Yenilə" %}</h3>

        <form method="POST" id="expense-form" data-sync-entity="expense" data-sync-action="update" data-sync-reset="false" data-sync-success-redirect="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?form=expense{% endif %}" data-sync-direct-online="true">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <input type="hidden" name="record_id" value="{{ expense.pk }}">
            <input type="hidden" name="record_version" value="{{ expense.updated_at|date:'c' }}">
            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Ana Kateqoriya <span style="color: #dc3545;">*</span></label>
                    <select id="category-select" required class="custom-input">
                        <option value="" disabled>{% trans "Kateqoriya seçin" %}</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if expense.subcategory and expense.subcategory.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" id="subcategory-field-group" {% if not expense.subcategory %}style="display: none;" {% endif %}>
                    <label>Alt Kateqoriya <span style="color: #dc3545;">*</span></label>
                    <select name="subcategory" id="subcategory-select" class="custom-input" required {% if not expense.subcategory %}disabled{% endif %}>
                        <option value="" disabled>{% trans "Alt kateqoriya seçin" %}</option>
                        {% if expense.subcategory %}
                        {% for sub in expense.subcategory.category.subcategories.all %}
                        <option value="{{ sub.id }}" {% if expense.subcategory_id == sub.id %}selected{% endif %}>{{ sub.name }}</option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>

                <div class="form-group" id="manual-name-group" {% if expense.subcategory %}style="display: none;" {% endif %}>
                    <label>Xərcin Növü (Digər) <span style="color: #dc3545;">*</span></label>
                    <input type="text" name="manual_name" id="manual-name-input" placeholder="{% trans 'Xərcin növünü daxil edin' %}"
                        class="custom-input" value="{{ expense.manual_name|default:'' }}">
                </div>
            </div>


            <div class="form-group">
                <label>Məbləğ ({% currency_symbol request.user %}) <span style="color: #dc3545;">*</span></label>
                <input type="number" name="amount" step="0.01" min="0" placeholder="0.00" class="custom-input" required
                    value="{{ expense.amount|stringformat:'.2f' }}">
            </div>
            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>{% trans "Tarix" %} <span style="color: #dc3545;">*</span></label>
                    <input type="date" name="date" required value="{{ expense.date|date:'Y-m-d' }}" class="custom-input">
                </div>
                <div class="form-group">
                    <label>{% trans "Saat" %} <span style="color: #dc3545;">*</span></label>
                    <input type="time" name="time" required value="{{ expense.time|time:'H:i' }}" class="custom-input">
                </div>
            </div>

            <div class="form-group">
                <label>{% trans "Əlavə Məlumat" %}</label>
                <textarea name="additional_info" placeholder="{% trans 'Məsələn: Mağaza adı, qəbz nömrəsi və s.' %}"
                    class="custom-input" rows="3">{{ expense.display_additional_info|default:'' }}</textarea>
            </div>

            <button type="submit" class="add-expense-btn">
                <i class="fa-solid fa-save"></i>
                <span>{% trans "Yadda Saxla" %}</span>
            </button>
        </form>
    </div>
</main>

{{ subcategory_data|json_script:"expense-subcats-data" }}
<script>
  {% include 'scripts/expenses/expense_form.js' %}
</script>
{% endblock %}
