{% extends 'base.html' %}
{% load i18n %}
{% load common_extras %}
{% block content %}
<header class="main-header">
    <div class="header-content">
        <div class="header-top">
            <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?type=tool{% endif %}" class="back-btn-box">
                <i class="fa-solid fa-arrow-left"></i>
                <span>{% trans "Aləti Düzəlt" %}</span>
            </a>
        </div>
    </div>
</header>

<main class="main-content" style="margin-top: -20px; position: relative; z-index: 10;">
    <div class="form-container-white">
        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">{% trans "Alət Məlumatlarını Yenilə" %}</h3>

        <form method="POST" id="tool-form" data-sync-entity="tool" data-sync-action="update" data-sync-reset="false" data-sync-success-redirect="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?type=tool{% endif %}" data-sync-direct-online="true">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <input type="hidden" name="record_id" value="{{ alet.pk }}">
            <input type="hidden" name="record_version" value="{{ alet.updated_at|date:'c' }}">
            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Ana Kateqoriya <span style="color: #dc3545;">*</span></label>
                    <select id="category-select" name="category" required class="custom-input">
                        <option value="" disabled>{% trans "Kateqoriya seçin" %}</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if alet.item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" id="item-field-group" {% if not alet.item %}style="display: none;" {% endif %}>
                    <label>Alət Növü <span style="color: #dc3545;">*</span></label>
                    <select id="item-select" name="item" required class="custom-input" {% if not alet.item %}disabled{% endif %}>
                        <option value="" disabled>{% trans "Alət seçin" %}</option>
                        {% if alet.item %}
                        {% for item in alet.item.category.items.all %}
                        <option value="{{ item.id }}" {% if alet.item_id == item.id %}selected{% endif %}>{{ item.name }}
                        </option>
                        {% endfor %}
                        {% endif %}
                    </select>
                </div>

                <div class="form-group" id="manual-name-group" {% if alet.item and alet.item.name != "Digər" %}style="display: none;" {% endif %}>
                    <label>Alətin Adı (Digər) <span style="color: #dc3545;">*</span></label>
                    <input type="text" name="manual_name" id="manual-name-input" placeholder="{% trans 'Alətin adını daxil edin' %}"
                        class="custom-input" value="{{ alet.manual_name|default:'' }}">
                </div>
            </div>

            <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Miqdar <span style="color: #dc3545;">*</span></label>
                    <input type="number" name="quantity" placeholder="0" class="custom-input" required
                        value="{{ alet.quantity }}">
                </div>
                <div class="form-group">
                    <label>Cəmi Məbləğ ({% currency_symbol request.user %})</label>
                    <input type="number" name="price" step="0.01" placeholder="0.00" class="custom-input"
                        value="{{ alet.price|stringformat:'.2f' }}">
                </div>
            </div>

            <div class="form-group" id="tool-zero-price-source-group" style="display: none;">
                <label>{% trans "Bu stok haradan gəlib?" %} <span class="required-star">*</span></label>
                <select name="zero_price_source" id="tool-zero-price-source" class="custom-input">
                    <option value="">{% trans "Seçin" %}</option>
                    {% for value, label in zero_price_source_choices %}
                    <option value="{{ value }}" {% if alet.zero_price_source == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                <div class="zero-price-source-note">{% trans "Məbləğ 0 olduqda mənbəni seçin." %}</div>
            </div>

            <div class="form-group">
                <label>Tarix <span style="color: #dc3545;">*</span></label>
                <input type="date" name="date" required value="{{ alet.date|date:'Y-m-d' }}"
                    class="custom-input">
            </div>
            <div class="form-group">
                <label>{% trans "Saat" %} <span style="color: #dc3545;">*</span></label>
                <input type="time" name="time" required value="{{ alet.time|time:'H:i' }}" class="custom-input">
            </div>

            <div class="form-group">
                <label>{% trans "Əlavə Məlumat" %}</label>
                <textarea name="additional_info" placeholder="{% trans 'Məsələn: Alətin vəziyyəti və s.' %}" class="custom-input"
                    rows="3">{{ alet.additional_info|default:'' }}</textarea>
            </div>

            <button type="submit" class="add-expense-btn">
                <i class="fa-solid fa-save"></i>
                <span>{% trans "Yadda Saxla" %}</span>
            </button>
        </form>
    </div>
</main>
{{ category_item_map|json_script:"tool-form-category-item-map" }}
<script>
  {% include 'scripts/tools/tool_form.js' %}
</script>
{% endblock %}
