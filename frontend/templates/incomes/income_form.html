{% extends 'base.html' %}
{% load i18n %}
{% load common_extras %}
{% block content %}
<header class="main-header">
    <div class="header-content">
        <div class="header-top">
            <a href="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?form=income{% endif %}" class="back-btn-box">
                <i class="fa-solid fa-arrow-left"></i>
                <span>{% trans "Gəliri Düzəlt" %}</span>
            </a>
        </div>
    </div>
</header>

<main class="main-content" style="margin-top: -20px; position: relative; z-index: 10;">
    <div class="form-container-white">
        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">{% trans "Gəlir Məlumatlarını Yenilə" %}</h3>

        <form method="POST" id="income-form" data-sync-entity="income" data-sync-action="update" data-sync-reset="false" data-sync-success-redirect="{% if next_url %}{{ next_url }}{% else %}{% url 'inventory:add_placeholder' %}?form=income{% endif %}" data-sync-direct-online="true">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <input type="hidden" name="record_id" value="{{ income.pk }}">
            <input type="hidden" name="record_version" value="{{ income.updated_at|date:'c' }}">
            <div class="desktop-form-grid">
                <div class="form-group">
                    <label>Ana Kateqoriya <span style="color: #dc3545;">*</span></label>
                    <select id="category-select" name="category" required class="custom-input">
                        <option value="" disabled>{% trans "Kateqoriya seçin" %}</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if income.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" id="item-field-group">
                    <label>Məhsul <span style="color: #dc3545;">*</span></label>
                    <select id="item-select" name="item_name" required class="custom-input"></select>
                </div>

                <div class="form-group" id="manual-name-group" style="display: none;">
                    <label>Məhsulun Adı (Digər) <span style="color: #dc3545;">*</span></label>
                    <input type="text" name="manual_name" id="manual-name-input" placeholder="{% trans 'Məhsulun adını daxil edin' %}"
                        class="custom-input">
                </div>

                <div class="form-row"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: 1 / -1;">
                    <div class="form-group">
                        <label>Miqdar <span style="color: #dc3545;">*</span></label>
                        <input type="number" name="quantity" step="0.01" min="0" placeholder="0.00" required
                            class="custom-input" value="{{ income.quantity|stringformat:'.2f' }}">
                    </div>
                    <div class="form-group">
                        <label>Ölçü Vahidi <span style="color: #dc3545;">*</span></label>
                        <select name="unit" id="unit-select" class="custom-input" required disabled>
                            <option value="" selected>{% trans "Əvvəlcə məhsul seçin" %}</option>
                        </select>
                    </div>
                </div>

                <div class="form-row"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: 1 / -1;">
                    <div class="form-group" id="gender-group" style="display: none;">
                        <label>Cinsiyyət <span style="color: #dc3545;">*</span></label>
                        <select id="gender-select" name="gender" class="custom-input">
                            <option value="" disabled>{% trans "Cinsiyyət seçin" %}</option>
                            <option value="erkek" {% if income.gender == "erkek" %}selected{% endif %}>{% trans "Erkək" %}</option>
                            <option value="disi" {% if income.gender == "disi" %}selected{% endif %}>{% trans "Dişi" %}</option>
                        </select>
                    </div>

                    <div class="form-group" id="animal-id-group" style="display: none;">
                        <label>{% trans "İdentifikasiya No" %}</label>
                        <input type="text" name="identification_no" id="animal-id-input"
                            placeholder="{% trans 'Məsələn: AZ12345' %}" class="custom-input">
                    </div>
                </div>

                <div class="form-row"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; grid-column: 1 / -1;">
                    <div class="form-group">
                        <label>Məbləğ ({% currency_symbol request.user %}) <span style="color: #dc3545;">*</span></label>
                        <input type="number" name="amount" step="0.01" min="0" placeholder="0.00" required
                            class="custom-input" value="{{ income.amount|stringformat:'.2f' }}">
                    </div>
                    <div class="form-group">
                        <label>Tarix <span style="color: #dc3545;">*</span></label>
                        <input type="date" name="date" required value="{{ income.date|date:'Y-m-d' }}"
                            class="custom-input">
                    </div>
                </div>
                <div class="form-group form-full-width">
                    <label>{% trans "Saat" %} <span style="color: #dc3545;">*</span></label>
                    <input type="time" name="time" required value="{{ income.time|time:'H:i' }}" class="custom-input">
                </div>

                <div class="form-group form-full-width">
                    <label>{% trans "Əlavə Məlumat" %}</label>
                    <textarea name="additional_info" placeholder="{% trans 'Məsələn: satış yeri, qeyd və s.' %}"
                        class="custom-input" rows="3">{{ income.additional_info|default:'' }}</textarea>
                </div>

                <button type="submit" class="add-expense-btn" style="width: 100%;">
                    <i class="fa-solid fa-save"></i>
                    <span>{% trans "Yadda Saxla" %}</span>
                </button>
            </div>
        </form>
    </div>
</main>

{{ category_data|json_script:"income-categories-data" }}
<script>
  {% include 'scripts/incomes/income_form.js' %}
</script>
{% endblock %}
